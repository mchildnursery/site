  body{
    background:radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 60%), linear-gradient(180deg, rgba(234,244,251,0.72), rgba(214,233,245,0.8));
    color:var(--ink); font-family:var(--font-body); min-height:100vh; line-height:var(--body-lh);
  }
  h1,h2,h3{font-family:var(--font-heading); margin:0;}
  .app-shell{max-width:1100px; margin:0 auto; padding:20px 18px 60px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:50%; background:var(--wood); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-weight:var(--w-semibold); font-size:16px; flex:none;}
  .brand-name{font-family:var(--font-heading); font-weight:var(--w-semibold); font-size:19px;}
  .brand-sub{font-family:var(--font-heading); font-style:var(--sub-style); font-size:13px; color:var(--ink-soft);}

  .lang-switch{display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:3px;}
  .lang-switch button{font-family:'Work Sans',sans-serif; font-size:12.5px; font-weight:500; padding:5px 12px; border-radius:16px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer;}
  .lang-switch button.active{background:var(--wood); color:#fff;}

  .btn{font-family:var(--font-body); font-weight:500; font-size:14px; padding:9px 16px; border-radius:8px; border:1px solid var(--wood-dark); background:var(--wood); color:#fff; cursor:pointer;}
  .btn:hover{background:var(--wood-dark);}
  .btn.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
  .btn.danger:hover{background:var(--red); color:#fff;}
  .btn.small{padding:5px 10px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
    font-family:var(--font-body); font-size:14.5px; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); width:100%;
  }
  input[type=date],input[type=number]{direction:ltr; text-align:start;}
  textarea{min-height:64px; resize:vertical;}
  label.field-label{font-size:12px; text-transform:var(--label-transform); letter-spacing:var(--label-spacing); color:var(--ink-soft); font-weight:500; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .row > .field{flex:1; min-width:160px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px;}
  .card h3{font-size:17px; margin-bottom:4px;}
  .muted{color:var(--ink-soft); font-size:13px;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0;}
  .tab-btn{font-family:var(--font-body); font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer;}
  .tab-btn.active{background:var(--wood); color:#fff; border-color:var(--wood-dark);}

  table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .data-table th{text-align:start; font-size:11.5px; text-transform:var(--label-transform); letter-spacing:var(--label-spacing); color:var(--ink-soft); border-bottom:2px solid var(--line); padding:8px 8px;}
  .data-table td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; unicode-bidi:plaintext;}
  .data-table tr:last-child td{border-bottom:none;}

  .badge{display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px;}
  .badge.green{background:var(--green-bg); color:var(--green);}
  .badge.yellow{background:var(--yellow-bg); color:var(--yellow);}
  .badge.red{background:var(--red-bg); color:var(--red);}
  .badge.blue{background:var(--blue-bg); color:var(--blue);}
  .badge.violet{background:var(--violet-bg); color:var(--violet);}

  .modal-overlay{position:fixed; inset:0; background:rgba(51,42,31,0.45); display:flex; align-items:flex-start; justify-content:center; z-index:60; padding:40px 16px; overflow-y:auto;}
  .modal{background:var(--card); border-radius:var(--radius); padding:22px 24px; max-width:560px; width:100%; box-shadow:0 10px 34px rgba(0,0,0,0.25);}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-close{cursor:pointer; color:var(--ink-soft); font-size:20px; line-height:1; background:none; border:none;}

  .tile{font-family:var(--font-body); font-size:13px; padding:7px 12px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); cursor:pointer;}
  .tile.on{background:var(--wood); color:#fff; border-color:var(--wood-dark);}
  .tile-row{display:flex; gap:8px; flex-wrap:wrap;}

  .login-wrap{max-width:420px; margin:70px auto 40px; padding:0 16px;}
  .role-tabs{display:flex; gap:6px; margin-bottom:18px;}
  .role-tabs .tab-btn{flex:1; text-align:center;}
  .top-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .top-bar-actions{display:flex; align-items:center; gap:10px;}
  .who{font-size:13px; color:var(--ink-soft);}
  .who b{color:var(--ink);}
  .empty-note{color:var(--ink-faint); font-style:var(--sub-style); font-size:13.5px; padding:10px 0;}
  hr.sep{border:none; border-top:1px solid var(--line); margin:16px 0;}
  .qbuilder-q{border:1px dashed var(--line); border-radius:8px; padding:12px; margin-bottom:10px;}
  .code-pill{font-family:monospace; font-size:14px; background:var(--paper-deep); border:1px solid var(--line); border-radius:6px; padding:3px 8px; letter-spacing:0.05em; direction:ltr; display:inline-block; unicode-bidi:isolate;}
  .ltr{direction:ltr; display:inline-block; unicode-bidi:isolate;}
  .gallery-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin-top:12px;}
  .gallery-item{background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:var(--shadow);}
  .gallery-item img{width:100%; height:120px; object-fit:cover; display:block; background:var(--paper-deep);}
  .gallery-item .gi-body{padding:8px 10px;}
  .gallery-item .gi-tag{font-size:11px; color:var(--ink-soft); text-transform:var(--label-transform); letter-spacing:var(--label-spacing);}
  .gallery-item .gi-caption{font-size:13px; margin-top:2px;}
  .home-hero{background:linear-gradient(135deg, var(--paper-deep), var(--pink-bg)); border-radius:var(--radius); padding:26px 24px; margin-bottom:18px;}
  .home-hero h2{font-size:24px; margin-bottom:6px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; left:0; top:0; width:100%;}
  }
  .p-page{font-family:var(--font-body); color:#2A2118; padding:20px;}
  .p-brand{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .p-brand-mark{width:26px; height:26px; border-radius:50%; background:#2A2118; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-weight:var(--w-semibold); font-size:13px;}
  .p-brand-name{font-family:var(--font-heading); font-weight:var(--w-semibold); font-size:14px;}
  .p-title{font-family:var(--font-heading); font-weight:var(--w-semibold); font-size:22px; margin-top:8px;}
  .p-sub{font-family:var(--font-heading); font-style:var(--sub-style); font-size:13px; color:#6E6151; margin-bottom:14px;}
  .p-meta{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; margin-bottom:14px;}
  .p-section{margin-bottom:16px;}
  .p-section h3{font-size:14px; border-bottom:1px solid #DCCEA9; padding-bottom:4px; margin-bottom:8px;}
  .p-checklist{display:flex; flex-wrap:wrap; gap:10px;}
  .p-check{display:flex; align-items:center; gap:6px; font-size:13px;}
  .p-box{width:12px; height:12px; border:1px solid #6E6151; display:inline-block;}
  .p-box.filled{background:#6E6151;}
  .p-table{width:100%; border-collapse:collapse; font-size:13px;}
  .p-table td{padding:4px 6px; border-bottom:1px solid #EAE0C4; unicode-bidi:plaintext;}
  .p-label{font-weight:600;}
  .p-grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .p-field{font-size:13px; margin-bottom:4px;}
  .p-empty{color:#9A8E7A; font-style:var(--sub-style);}
  .p-note-box{border:1px solid #DCCEA9; border-radius:6px; padding:8px; font-size:13px; min-height:30px; margin-bottom:8px;}
  .p-footer{font-size:11px; color:#9A8E7A; margin-top:10px;}
</style>
</head>
<body>

<div class="app-shell">
  <div class="brand-row" id="brandRow"></div>
  <div id="loginScreen"></div>
  <div id="appScreen" style="display:none;">
    <div class="top-bar">
      <div class="who" id="whoBar"></div>
      <div class="top-bar-actions">
        <div id="langSwitchApp"></div>
        <button class="btn ghost small" id="logoutBtn" onclick="logout()"></button>
      </div>
    </div>
    <div class="tabs" id="tabNav"></div>
    <div id="mainArea"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
/* ===================== STORAGE LAYER ===================== */
(function(){
  const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
  const localBackend = {
    async get(key){ const raw = window.localStorage.getItem(key); if(raw===null) throw new Error('not found'); return {key,value:raw,shared:false}; },
    async set(key,value){ window.localStorage.setItem(key,value); return {key,value,shared:false}; },
    async delete(key){ window.localStorage.removeItem(key); return {key,deleted:true,shared:false}; },
    async list(prefix){ const keys=[]; for(let i=0;i<window.localStorage.length;i++){ const k=window.localStorage.key(i); if(!prefix||k.indexOf(prefix)===0) keys.push(k); } return {keys,prefix,shared:false}; }
  };
  window.__store = hasCloudStorage ? window.storage : localBackend;
  window.__storeIsShared = hasCloudStorage;
})();

async function getJSON(key, fallback){
  try{ const r = await window.__store.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function setJSON(key, value){
  try{ await window.__store.set(key, JSON.stringify(value), true); return true; }
  catch(e){ return false; }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent = (s===undefined||s===null)?'':String(s); return d.innerHTML; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function randomCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }

/* ===================== LANGUAGE / TRANSLATIONS ===================== */

  if(l!==LANG){

  applyLangAttrs();
  renderBrand();
  boot();
}

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

async function listReportsForChild(childId){
  try{
    const res = await window.__store.list('report:'+childId+':', true);
    const keys = (res && res.keys) ? res.keys : [];
    return keys.map(k=>k.slice(('report:'+childId+':').length)).sort().reverse();
  }catch(e){ return []; }
}
async function listAllReportKeys(){
  try{ const res = await window.__store.list('report:', true); return (res && res.keys) ? res.keys : []; }
  catch(e){ return []; }
}
async function getParentsForChild(childId){
  const parents = await getParents();
  return parents.filter(p=>p.childId===childId);
}

// A report only becomes visible to a parent once a teacher explicitly shares it with them.
async function listVisibleReportsForParent(childId, parentId){
  const dates = await listReportsForChild(childId);
  const visible = [];
  for(const d of dates){
    const r = await getReport(childId, d);
    if(!r || !Array.isArray(r.sharedWith) || r.sharedWith.length===0) continue;
    if(!parentId || r.sharedWith.includes(parentId)) visible.push(d);
  }
  return visible;
}

async function loginAsParentAccount(){

let CURRENT_TAB = null;

async function boot(){
  applyLangAttrs();
  renderBrand();
  document.getElementById('logoutBtn').textContent = t('logoutBtn');
  document.getElementById('langSwitchApp').innerHTML = langSwitchHTML();
  const s = getSession();
  if(!s){
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('appScreen').style.display = 'none';
    renderLoginScreen();
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  if(s.role==='admin'){
    document.getElementById('whoBar').innerHTML = `${t('signedInAsAdmin')} <b>${t('adminWord')}</b>`;
    renderTabs(TABS_ORDER);
  } else if(s.role==='teacher'){
    document.getElementById('whoBar').innerHTML = `${t('signedInAsAdmin')} <b>${esc(s.teacherName)}</b> · ${t('teacherWord')}`;
    renderTabs(TABS_ORDER.filter(x=>x!=='Teachers' && x!=='Parents'));
  } else if(s.role==='parent'){
    const children = await getChildren();
    const child = children.find(c=>c.id===s.childId);
    document.getElementById('whoBar').innerHTML = child ? `${t('viewingChild')} <b>${esc(child.name)}</b>${t('accountWord')}` : t('parentViewLabel');
    document.getElementById('tabNav').innerHTML = '';
    renderParentView();
    return;
  }
  if(!CURRENT_TAB) CURRENT_TAB = 'Home';
  await renderTab(CURRENT_TAB);
}

function renderTabs(tabs){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = tabs.map(tb=>`<button class="tab-btn ${CURRENT_TAB===tb?'active':''}" data-tab="${tb}" onclick="switchTab('${tb}')">${t(TAB_KEY_STRING[tb])}</button>`).join('');
  if(!tabs.includes(CURRENT_TAB)) CURRENT_TAB = tabs[0];
}
async function switchTab(tb){
  CURRENT_TAB = tb;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tb));
  await renderTab(tb);
}
async function renderTab(tb){
  const main = document.getElementById('mainArea');
  main.innerHTML = `<p class="muted">${t('loadingText')}</p>`;
  if(tb==='Home') return renderHomeTab();
  if(tb==='Teachers') return renderTeachersTab();
  if(tb==='Parents') return renderParentsTab();
  if(tb==='Classes') return renderClassesTab();
  if(tb==='Children') return renderChildrenTab();
  if(tb==='Materials') return renderMaterialsTab();
  if(tb==='Quizzes') return renderQuizzesTab();
  if(tb==='Homework') return renderHomeworkTab();
  if(tb==='Daily Reports') return renderReportsTab();
  if(tb==='Gallery') return renderGalleryTab();
}

async function resetAllData(){
  const ok1 = confirm(t('confirmDeleteAll'));
  if(!ok1) return;
  const typed = prompt(t('deleteConfirmPrompt'));
  if((typed||'').trim().toUpperCase() !== 'DELETE'){ document.getElementById('resetAllMsg').textContent = t('deleteCancelled'); return; }
  document.getElementById('resetAllMsg').textContent = t('deletingText');
  try{
    const res = await window.__store.list('', true);
    const keys = (res && res.keys) ? res.keys : [];
    for(const k of keys){
      try{ await window.__store.delete(k, true); }catch(e){}
    }
    alert(t('deletedAlert'));
    logout();
  }catch(e){
    document.getElementById('resetAllMsg').textContent = t('deleteError');
  }
}

  const classIds = await visibleClassIds();
  const classes = await getClasses();
  const quizzes = (await getQuizzes()).filter(q=>classIds.includes(q.classId));
  const className = id => (classes.find(c=>c.id===id)||{}).name || '—';
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="card">
      <h3>${t('quizzesTitle')}</h3>
      ${quizzes.length===0 ? `<p class="empty-note">${t('noQuizzesYet')}</p>` : `
      <table class="data-table"><thead><tr><th>${t('thTitle')}</th><th>${t('thClass')}</th><th>${t('thQuestions')}</th><th>${t('thDate')}</th><th></th></tr></thead><tbody>
      ${quizzes.slice().reverse().map(q=>`<tr><td>${esc(q.title)}</td><td>${esc(className(q.classId))}</td><td>${q.questions.length}</td><td class="ltr">${esc(q.date)}</td>
      <td><button class="btn small" onclick="openRecordResults('${q.id}')">${t('recordResultsBtn')}</button>
      <button class="btn danger small" onclick="removeQuiz('${q.id}')">${t('removeBtn')}</button></td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="card">
      <h3>${t('createQuizTitle')}</h3>
      ${classIds.length===0 ? `<p class="empty-note">${t('createClassFirst')}</p>` : `
      <div class="row">
        <div class="field"><label class="field-label">${t('titleLabel')}</label><input type="text" id="newQuizTitle"></div>
        <div class="field"><label class="field-label">${t('classLabel')}</label><select id="newQuizClass">${classes.filter(c=>classIds.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      </div>
      <div id="quizQuestionsWrap"></div>
      <button class="btn ghost small" onclick="addQuizQuestion()">${t('addQuestionBtn')}</button>
      <hr class="sep">
      <button class="btn" onclick="saveQuiz()">${t('saveQuizBtn')}</button>
      <div id="quizSaveMsg" class="muted" style="margin-top:8px;"></div>`}
    </div>
  `;
  if(classIds.length>0){ QUIZ_BUILDER_QUESTIONS = []; addQuizQuestion(); }
}
function addQuizQuestion(){
  QUIZ_BUILDER_QUESTIONS.push({text:'', options:['','','',''], correctIndex:0});
  renderQuizQuestions();
}
function removeQuizQuestion(i){
  QUIZ_BUILDER_QUESTIONS.splice(i,1);
  renderQuizQuestions();
}
function renderQuizQuestions(){
  const wrap = document.getElementById('quizQuestionsWrap');
  wrap.innerHTML = QUIZ_BUILDER_QUESTIONS.map((q,i)=>`
    <div class="qbuilder-q">
      <div class="field"><label class="field-label">${t('questionLabel')} ${i+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="QUIZ_BUILDER_QUESTIONS[${i}].text=this.value"></div>
      <div class="row">
        ${q.options.map((o,oi)=>`
        <div class="field" style="min-width:120px;">
          <label class="field-label"><input type="radio" name="correct${i}" ${q.correctIndex===oi?'checked':''} onchange="QUIZ_BUILDER_QUESTIONS[${i}].correctIndex=${oi}"> ${t('optionLabel')} ${oi+1}</label>
          <input type="text" value="${esc(o)}" oninput="QUIZ_BUILDER_QUESTIONS[${i}].options[${oi}]=this.value">
        </div>`).join('')}
      </div>
      ${QUIZ_BUILDER_QUESTIONS.length>1?`<button class="btn ghost small" onclick="removeQuizQuestion(${i})">${t('removeQuestionBtn')}</button>`:''}
    </div>
  `).join('');
}
async function saveQuiz(){
  const title = document.getElementById('newQuizTitle').value.trim();
  const classId = document.getElementById('newQuizClass').value;
  if(!title || QUIZ_BUILDER_QUESTIONS.some(q=>!q.text.trim())){
    document.getElementById('quizSaveMsg').textContent = t('quizFillAllMsg');
    return;
  }
  const quizzes = await getQuizzes();
  quizzes.push({id:uid(), title, classId, questions:JSON.parse(JSON.stringify(QUIZ_BUILDER_QUESTIONS)), date:todayISO()});
  await saveQuizzes(quizzes);
  renderQuizzesTab();
}
async function removeQuiz(id){
  if(!confirm(t('confirmRemoveQuiz'))) return;
  let quizzes = await getQuizzes();
  quizzes = quizzes.filter(q=>q.id!==id);
  await saveQuizzes(quizzes);
  renderQuizzesTab();
}
async function openRecordResults(quizId){
  const quizzes = await getQuizzes();
  const quiz = quizzes.find(q=>q.id===quizId);
  const children = (await getChildren()).filter(c=>c.classId===quiz.classId);
  const results = await getQuizResults();
  openModal(`
    <div class="modal-head"><h3>${t('recordResultsTitle')} ${esc(quiz.title)}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="muted">${t('outOfQuestions')} ${quiz.questions.length} ${t('questionsWord')}</p>
    ${children.length===0 ? `<p class="empty-note">${t('noChildrenInClass')}</p>` : children.map(c=>{
      const existing = results.find(r=>r.childId===c.id && r.quizId===quizId);
      return `<div class="field row"><div style="flex:2;min-width:120px;padding-top:8px;">${esc(c.name)}</div>
      <div style="flex:1;min-width:80px;"><input type="number" min="0" max="${quiz.questions.length}" id="score_${c.id}" value="${existing?existing.score:''}" placeholder="${t('scorePlaceholder')}"></div></div>`;
    }).join('')}
    ${children.length>0?`<button class="btn" onclick="saveQuizResults('${quizId}')">${t('saveResultsBtn')}</button>`:''}
  `);
}
async function saveQuizResults(quizId){
  const quizzes = await getQuizzes();
  const quiz = quizzes.find(q=>q.id===quizId);
  const children = (await getChildren()).filter(c=>c.classId===quiz.classId);
  let results = await getQuizResults();
  children.forEach(c=>{
    const input = document.getElementById('score_'+c.id);
    if(!input || input.value==='') return;
    const score = Number(input.value);
    const idx = results.findIndex(r=>r.childId===c.id && r.quizId===quizId);
    const record = {id: idx>-1?results[idx].id:uid(), childId:c.id, quizId, quizTitle:quiz.title, score, total:quiz.questions.length, date:todayISO()};
    if(idx>-1) results[idx] = record; else results.push(record);
  });
  await saveQuizResults(results);
  closeModal();
}

async function openHomeworkStatus(hwId){
  const homework = await getHomework();
  const hw = homework.find(h=>h.id===hwId);
  const children = (await getChildren()).filter(c=>c.classId===hw.classId);
  const statuses = await getHwStatus();
  openModal(`
    <div class="modal-head"><h3>${esc(hw.title)} ${t('statusOfWord')}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    ${children.length===0 ? `<p class="empty-note">${t('noChildrenInClass')}</p>` : children.map(c=>{
      const st = statuses.find(s=>s.childId===c.id && s.homeworkId===hwId);
      const val = st ? st.status : 'pending';
      return `<div class="field row"><div style="flex:2;min-width:120px;padding-top:8px;">${esc(c.name)}</div>
      <div style="flex:1;min-width:130px;"><select id="hwstatus_${c.id}">
        <option value="pending" ${val==='pending'?'selected':''}>${t('statusPending')}</option>
        <option value="submitted" ${val==='submitted'?'selected':''}>${t('statusSubmitted')}</option>
        <option value="done" ${val==='done'?'selected':''}>${t('statusDone')}</option>
      </select></div></div>`;
    }).join('')}
    ${children.length>0?`<button class="btn" onclick="saveHomeworkStatus('${hwId}')">${t('saveBtn')}</button>`:''}
  `);
}
async function saveHomeworkStatus(hwId){
  const homework = await getHomework();
  const hw = homework.find(h=>h.id===hwId);
  const children = (await getChildren()).filter(c=>c.classId===hw.classId);
  let statuses = await getHwStatus();
  children.forEach(c=>{
    const sel = document.getElementById('hwstatus_'+c.id);
    if(!sel) return;
    const idx = statuses.findIndex(s=>s.childId===c.id && s.homeworkId===hwId);
    const record = {id: idx>-1?statuses[idx].id:uid(), childId:c.id, homeworkId:hwId, status:sel.value, date:todayISO()};
    if(idx>-1) statuses[idx] = record; else statuses.push(record);
  });
  await saveHwStatus(statuses);
  closeModal();
}

function onGalleryKindChange(){
  const kind = document.getElementById('newGalleryKind').value;
  document.getElementById('galleryClassField').style.display = kind==='class' ? 'block' : 'none';
  document.getElementById('galleryEventField').style.display = kind==='event' ? 'block' : 'none';
}
async function addGalleryItem(){
  const kind = document.getElementById('newGalleryKind').value;
  const caption = document.getElementById('newGalleryCaption').value.trim();
  const file = document.getElementById('newGalleryFile').files[0];
  const url = document.getElementById('newGalleryUrl').value.trim();
  const msg = document.getElementById('gallerySaveMsg');
  let imageData = '';
  try{
    if(file){ imageData = await readFileAsDataURL(file); }
    else if(url){ imageData = url; }
  }catch(e){ msg.textContent = t('errCouldNotReadFile'); return; }
  if(!imageData){ msg.textContent = t('errChooseFileOrUrl'); return; }
  const item = {id:uid(), kind, caption, imageData, date:todayISO()};
  if(kind==='class'){
    const classId = document.getElementById('newGalleryClass').value;
    if(!classId){ msg.textContent = t('errChooseClass'); return; }
    const classes = await getClasses();
    item.classId = classId;
    item.classNameCache = (classes.find(c=>c.id===classId)||{}).name || '';
  } else {
    const eventName = document.getElementById('newGalleryEvent').value.trim();
    if(!eventName){ msg.textContent = t('errEnterEventName'); return; }
    item.eventName = eventName;
  }
  const gallery = await getGallery();
  gallery.push(item);
  const ok = await saveGallery(gallery);
  if(!ok){ msg.textContent = t('errPhotoTooLarge'); return; }
  renderGalleryTab();
}
async function removeGalleryItem(id){
  if(!confirm(t('confirmRemovePhoto'))) return;
  let gallery = await getGallery();
  gallery = gallery.filter(g=>g.id!==id);
  await saveGallery(gallery);
  renderGalleryTab();
}

async function loadReportForm(){
  const childId = document.getElementById('reportChildSelect').value;
  const date = document.getElementById('reportDateInput').value || todayISO();
  const children = await getChildren();
  const classes = await getClasses();
  const teachers = await getTeachers();
  const child = children.find(c=>c.id===childId);
  const cls = classes.find(c=>c.id===child.classId);
  const teacherName = (teachers.find(tc=>tc.id===cls.teacherId)||{}).name || '—';
  const existing = await getReport(childId, date);
  REPORT_STATE = existing || blankReportState();
  if(!Array.isArray(REPORT_STATE.sharedWith)) REPORT_STATE.sharedWith = [];
  const childParents = await getParentsForChild(childId);
  REPORT_CTX = {childId, childName:child.name, className:cls.name, teacherName, teacherId:cls.teacherId, date, childParents};
  renderReportForm();
}

      <button type="button" class="tile ${s.rest.rested?'on':''}" onclick="toggleRest('rested')">${t('restedBtn')}</button>
    </div>
    <div class="field"><label class="field-label">${t('notesLabel')}</label><textarea oninput="updateRestNote(this.value)">${esc(s.rest.restNote)}</textarea></div>

    <h3 style="font-size:15px;">${t('bathroomTitle')}</h3>
    <div class="row">
      <div class="field"><label class="field-label">${t('urineLabel')}</label><input type="number" min="0" max="3" value="${s.bathroom.urine}" oninput="updateBathroom('urine', this.value)"></div>
      <div class="field"><label class="field-label">${t('stoolLabel')}</label><input type="number" min="0" max="3" value="${s.bathroom.stool}" oninput="updateBathroom('stool', this.value)"></div>
    </div>

    <h3 style="font-size:15px;">${t('notesHomeTitle')}</h3>
    <div class="field"><label class="field-label">${t('forParentsLabel')}</label><textarea oninput="updateNotes('notesForParents', this.value)">${esc(s.notesForParents)}</textarea></div>
    <div class="field"><label class="field-label">${t('fromParentsLabel')}</label><textarea oninput="updateNotes('notesFromParents', this.value)">${esc(s.notesFromParents)}</textarea></div>

    <h3 style="font-size:15px;">${t('shareTitle')}</h3>
    ${(REPORT_CTX.childParents||[]).length===0 ? `<p class="empty-note">${t('noParentAccountsForChild')}</p>` : `
    <p class="muted" style="margin-top:-4px;">${t('sendingNote')}</p>
    <div class="tile-row" style="margin-bottom:8px;">${REPORT_CTX.childParents.map(p=>`<button type="button" class="tile ${s.sharedWith.includes(p.id)?'on':''}" onclick="toggleShareParent('${p.id}')">${esc(p.username)}</button>`).join('')}</div>
    <button class="btn ghost small" onclick="sendReportToParents()">${t('sendCopyBtn')}</button>
    ${s.sharedWith.length ? `<p class="muted" style="margin-top:6px;">${t('currentlySharedWith')} ${s.sharedWith.map(id=>{ const p=(REPORT_CTX.childParents||[]).find(x=>x.id===id); return p?esc(p.username):null; }).filter(Boolean).join('، ')}</p>` : ''}
    `}

    <hr class="sep">
    <button class="btn ghost" onclick="saveReportDraft()">${t('saveDraftBtn')}</button>
    <button class="btn" onclick="sendReportToAdmin()">${t('sendToAdminBtn')}</button>
    <button class="btn ghost" onclick="printReport()">${t('printBtn')}</button>
    <div id="reportSaveMsg" class="muted" style="margin-top:8px;"></div>
  `;
}
function toggleShareParent(parentId){
  const i = REPORT_STATE.sharedWith.indexOf(parentId);
  if(i>-1) REPORT_STATE.sharedWith.splice(i,1); else REPORT_STATE.sharedWith.push(parentId);
  renderReportForm();
}
async function sendReportToParents(){
  await saveReportDraft();
  document.getElementById('reportSaveMsg').textContent = REPORT_STATE.sharedWith.length
    ? t('sharedWithSelected')
    : t('noParentsSelected');
}
function toggleMood(m){ const i=REPORT_STATE.mood.indexOf(m); if(i>-1) REPORT_STATE.mood.splice(i,1); else REPORT_STATE.mood.push(m); renderReportForm(); }
function updateMealDesc(meal,v){ REPORT_STATE.meals[meal].desc = v; }
function updateMealQty(meal,q){ REPORT_STATE.meals[meal].qty = q; renderReportForm(); }
function updateLearning(k,v){ REPORT_STATE.learning[k] = v; }
function toggleRest(k){ REPORT_STATE.rest[k] = !REPORT_STATE.rest[k]; renderReportForm(); }
function updateRestNote(v){ REPORT_STATE.rest.restNote = v; }
function updateBathroom(k,v){ REPORT_STATE.bathroom[k] = Math.max(0, Math.min(3, Number(v)||0)); }
function updateNotes(k,v){ REPORT_STATE[k] = v; }

async function saveReportDraft(){
  REPORT_STATE.status = REPORT_STATE.status || 'draft';
  REPORT_STATE.teacherName = REPORT_CTX.teacherName;
  REPORT_STATE.teacherId = REPORT_CTX.teacherId;
  REPORT_STATE.className = REPORT_CTX.className;
  REPORT_STATE.childName = REPORT_CTX.childName;
  const ok = await saveReport(REPORT_CTX.childId, REPORT_CTX.date, REPORT_STATE);
  document.getElementById('reportSaveMsg').textContent = ok ? t('savedMsg') : t('saveFailedMsg');
  renderReportHistory();
}
async function sendReportToAdmin(){
  REPORT_STATE.status = 'sent';
  REPORT_STATE.sentAt = new Date().toLocaleString(LANG==='ar'?'ar-EG':'en-US');
  await saveReportDraft();
  document.getElementById('reportSaveMsg').textContent = t('sentToAdminMsg');
  renderReportForm();
}
function fieldOrEmpty(v){ return v && v.trim() ? esc(v) : `<span class="p-empty">${t('nothingRecorded')}</span>`; }
function printReport(){
  const s = REPORT_STATE, ctx = REPORT_CTX;
  const moodChecklist = MOOD_KEYS.map(m=>`<div class="p-check"><span class="p-box${s.mood.includes(m)?' filled':''}"></span>${esc(lbl(MOOD_STRINGS,m))}</div>`).join('');
  const mealsRows = MEAL_KEYS.map(meal=>{ const m=s.meals[meal]; return `<tr><td class="p-label">${esc(lbl(MEAL_STRINGS,meal))}</td><td>${fieldOrEmpty(m.desc)}</td><td style="width:90px;font-weight:600;">${m.qty?esc(lbl(QTY_STRINGS,m.qty)):'<span class="p-empty">—</span>'}</td></tr>`; }).join('');
  const col = keys => keys.map(k=>`<div class="p-field"><b>${esc(lbl(LEARNING_STRINGS,k))}:</b> ${fieldOrEmpty(s.learning[k])}</div>`).join('');
  const dotsFor = n => { let o=''; for(let i=0;i<3;i++) o+=`<span class="p-box${i<n?' filled':''}" style="border-radius:50%;margin-inline-end:4px;"></span>`; return o; };
  document.getElementById('printArea').innerHTML = `
    <div class="p-page">
      <div class="p-brand"><div class="p-brand-mark">${t('brandMark')}</div><div class="p-brand-name">${t('appTitle')}</div></div>
      <div class="p-title">${t('dailyReportTitle')}</div>
      <div class="p-sub">${t('dailyReportSub')}</div>
      <div class="p-meta"><div><b>${t('childWordColon')}</b> ${esc(ctx.childName)}</div><div><b>${t('classWord')}</b> ${esc(ctx.className)}</div><div><b>${t('teacherWordColon')}</b> ${esc(ctx.teacherName)}</div><div><b>${t('dateWordColon')}</b> <span class="ltr">${esc(ctx.date)}</span></div></div>
      <div class="p-section"><h3>${t('moodTitle').replace(' today','').replace(' اليوم','')}</h3><div class="p-checklist">${moodChecklist}</div></div>
      <div class="p-section"><h3>${t('mealsTitle')}</h3><table class="p-table"><tr><td class="p-label">${t('mealTh')}</td><td>${t('offeredTh')}</td><td>${t('amountTh')}</td></tr>${mealsRows}</table></div>
      <div class="p-section"><h3>${t('learningTitle')}</h3><div class="p-grid2"><div>${col(['practicalLife','sensorial','language','geography'])}</div><div>${col(['math','art','history','science'])}</div></div>
        <div class="p-field" style="margin-top:6px;"><b>${t('circleTimeLabel')}:</b> ${fieldOrEmpty(s.learning.circleTime)}</div><div class="p-field"><b>${t('todayWeReadLabel')}:</b> ${fieldOrEmpty(s.learning.weRead)}</div></div>
      <div class="p-section"><h3>${t('restTitle')}</h3><div class="p-checklist"><div class="p-check"><span class="p-box${s.rest.slept?' filled':''}"></span>${t('sleptBtn')}</div><div class="p-check"><span class="p-box${s.rest.rested?' filled':''}"></span>${t('restedBtn')}</div></div>
        <div class="p-field" style="margin-top:6px;"><b>${t('notesLabel')}:</b> ${fieldOrEmpty(s.rest.restNote)}</div></div>
      <div class="p-section"><h3>${t('bathroomTitle')}</h3><div class="p-checklist"><div class="p-check">${t('urineLabel').split(' (')[0]}: ${dotsFor(s.bathroom.urine)} (${s.bathroom.urine} ${t('ofThree')})</div><div class="p-check">${t('stoolLabel').split(' (')[0]}: ${dotsFor(s.bathroom.stool)} (${s.bathroom.stool} ${t('ofThree')})</div></div></div>
      <div class="p-section"><h3>${t('notesHomeTitle')}</h3><div class="p-field"><b>${t('forParentsLabel')}</b></div><div class="p-note-box">${fieldOrEmpty(s.notesForParents)}</div><div class="p-field"><b>${t('fromParentsLabel')}</b></div><div class="p-note-box">${fieldOrEmpty(s.notesFromParents)}</div></div>
      <div class="p-footer">${t('printedOn')} ${new Date().toLocaleDateString(LANG==='ar'?'ar-EG':'en-US')}</div>
    </div>`;
  window.print();
}

/* ===================== PARENT VIEW ===================== */
async function renderParentView(){
  const s = getSession();
  const children = await getChildren();
  const child = children.find(c=>c.id===s.childId);
  const main = document.getElementById('mainArea');
  if(!child){ main.innerHTML = `<p class="empty-note">${t('childNotFound')}</p>`; return; }
  const classes = await getClasses();
  const teachers = await getTeachers();
  const cls = classes.find(c=>c.id===child.classId) || {};
  const teacherName = (teachers.find(tc=>tc.id===cls.teacherId)||{}).name || '—';
  const materials = (await getMaterials()).filter(m=>m.classId===child.classId);
  const homework = (await getHomework()).filter(h=>h.classId===child.classId);
  const hwStatuses = await getHwStatus();
  const quizResults = (await getQuizResults()).filter(r=>r.childId===child.id);
  const reportDates = await listVisibleReportsForParent(child.id, s.parentId);
  const about = await getAboutText();
  const gallery = (await getGallery()).filter(g=> g.kind==='event' || g.classId===child.classId);

  main.innerHTML = `
    <div class="home-hero">
      <h2>${t('appTitle')}</h2>
      <p class="muted">${esc(about || t('aboutDefault'))}</p>
    </div>
    <div class="card">
      <h3>${esc(child.name)}</h3>
      <p class="muted">${t('classWord')} ${esc(cls.name||'—')} · ${t('teacherWordColon')} ${esc(teacherName)}</p>
    </div>

    <div class="card">
      <h3>${t('galleryTitle')}</h3>
      ${gallery.length===0 ? `<p class="empty-note">${t('noPhotosYet')}</p>` : `
      <div class="gallery-grid">
        ${gallery.slice().reverse().map(g=>`<div class="gallery-item"><img src="${esc(g.imageData)}" alt=""><div class="gi-body"><div class="gi-tag">${g.kind==='event'?esc(g.eventName):esc(g.classNameCache||cls.name||'')}</div><div class="gi-caption">${esc(g.caption||'')}</div></div></div>`).join('')}
      </div>`}
    </div>

    <div class="card">
      <h3>${t('materialsTitle')}</h3>
      ${materials.length===0 ? `<p class="empty-note">${t('noMaterialsYet')}</p>` : `<table class="data-table"><thead><tr><th>${t('thTitle')}</th><th>${t('thNotes')}</th><th>${t('thDate')}</th></tr></thead><tbody>
      ${materials.slice().reverse().map(m=>`<tr><td>${esc(m.title)}</td><td>${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.link)}</a><br>`:''}${esc(m.description)}</td><td class="ltr">${esc(m.date)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h3>${t('homeworkTitle')}</h3>
      ${homework.length===0 ? `<p class="empty-note">${t('noHomeworkYet')}</p>` : `<table class="data-table"><thead><tr><th>${t('thTitle')}</th><th>${t('thDue')}</th><th>${t('thStatus')}</th></tr></thead><tbody>
      ${homework.slice().reverse().map(h=>{
        const st = hwStatuses.find(x=>x.childId===child.id && x.homeworkId===h.id);
        const val = st?st.status:'pending';
        const badgeClass = val==='done'?'green':(val==='submitted'?'blue':'yellow');
        return `<tr><td>${esc(h.title)}<br><span class="muted">${esc(h.description)}</span></td><td class="ltr">${esc(h.dueDate)}</td>
        <td><span class="badge ${badgeClass}">${lbl(HW_STATUS_STRINGS,val)}</span> ${val==='pending'?`<button class="btn ghost small" onclick="parentMarkSubmitted('${h.id}')">${t('markSubmittedBtn')}</button>`:''}</td></tr>`;
      }).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h3>${t('quizResultsTitle')}</h3>
      ${quizResults.length===0 ? `<p class="empty-note">${t('noQuizResultsYet')}</p>` : `<table class="data-table"><thead><tr><th>${t('thQuiz')}</th><th>${t('thScore')}</th><th>${t('thDate')}</th></tr></thead><tbody>
      ${quizResults.slice().reverse().map(r=>`<tr><td>${esc(r.quizTitle)}</td><td><span class="ltr">${r.score} / ${r.total}</span></td><td class="ltr">${esc(r.date)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>

    <div class="card">
      <h3>${t('reportsTitle')}</h3>
      ${reportDates.length===0 ? `<p class="empty-note">${t('noReportsSharedYet')}</p>` : `
      <div class="field"><label class="field-label">${t('chooseDateLabel')}</label><select id="parentReportDate">${reportDates.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
      <button class="btn ghost small" onclick="parentViewReport('${child.id}')">${t('viewBtn')}</button>
      <div id="parentReportView" style="margin-top:14px;"></div>`}
    </div>
  `;
}
async function parentMarkSubmitted(hwId){
  const s = getSession();
  let statuses = await getHwStatus();
  const idx = statuses.findIndex(x=>x.childId===s.childId && x.homeworkId===hwId);
  const record = {id: idx>-1?statuses[idx].id:uid(), childId:s.childId, homeworkId:hwId, status:'submitted', date:todayISO()};
  if(idx>-1) statuses[idx] = record; else statuses.push(record);
  await saveHwStatus(statuses);
  renderParentView();
}
async function parentViewReport(childId){
  const date = document.getElementById('parentReportDate').value;
  const report = await getReport(childId, date);
  const children = await getChildren();
  const classes = await getClasses();
  const teachers = await getTeachers();
  const child = children.find(c=>c.id===childId);
  const cls = classes.find(c=>c.id===child.classId);
  const teacherName = (teachers.find(tc=>tc.id===cls.teacherId)||{}).name || '—';
  REPORT_STATE = report || blankReportState();
  REPORT_CTX = {childId, childName:child.name, className:cls.name, teacherName, date};
  const s = REPORT_STATE;
  const moodList = s.mood.length ? s.mood.map(m=>lbl(MOOD_STRINGS,m)).join('، ') : '—';
  document.getElementById('parentReportView').innerHTML = `
    <p><b>${t('moodLabel')}</b> ${esc(moodList)}</p>
    <p><b>${t('notesForParentsColon')}</b> ${fieldOrEmpty(s.notesForParents)}</p>
    <button class="btn ghost small" onclick="printReport()">${t('printBtn')}</button>
  `;
}

/* ===================== INIT ===================== */
boot();
</script>
</body>
</html>
